<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGJS Example</title>
</head>
<body>
  <input type="file" id="wadSelector" accept=".wad" onchange="openWad(event)"/>
  <canvas id="doomCanvas" width="320" height="200"></canvas>
	<script src="https://miko.art/labs/midi-js/js/midi/player.js" type="text/javascript"></script>
  <script type='text/javascript' src='../../doomgeneric/doomgeneric.js'></script>
  <script>
    var keyQueue = [];
    const canvasScreen = new ImageData(320, 200);
    const canvasCtx = document.getElementById("doomCanvas").getContext('2d');
    const DGJS_MusicType = true;
    
    function openWad(event) {
        const file = event.target.files[0];
        if (file && file.size) {
            console.log(file.name);
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('wadSelector').remove();
                const uint8File = new Uint8Array(event.target.result);
                let stream = FS.open("/" + (file.name).toLowerCase(), "w+");
                FS.write(stream, uint8File, 0, file.size, 0);
                FS.close(stream);
                Module.ccall(
                    'doomgeneric_Create',
                    'void',
                    ['number', 'number'],
                    [0, 0]
                );
                wadLoaded=true;
                doomInterval = setInterval(_doomgeneric_Tick, 0);
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function DGJS_DrawFrame(framePtr, frameWidth, frameHeight) {
        let framebuffer = Module.HEAPU8.subarray(framePtr, framePtr + frameWidth*frameHeight*4);
        for (let i = 0; i < frameWidth*frameHeight*4; i += 4) {
            canvasScreen.data[i] = framebuffer[i + 2];
            canvasScreen.data[i + 1] = framebuffer[i + 1];
            canvasScreen.data[i + 2] = framebuffer[i];
            canvasScreen.data[i + 3] = 255;
        }
        canvasCtx.putImageData(canvasScreen, 0, 0);
    }

    function DGJS_SetTitle(titlePtr, titleLen) {
        let titleChar = Module.HEAPU8.subarray(titlePtr, titlePtr + titleLen);
        document.title = String.fromCharCode(...titleChar);
    }

    function DGJS_GetKey() {
        var keys = keyQueue.pop();
        if (keys)
            return keys;

        return [0, 0];
    }

    // MIDi stuff
    var songs = [];

    function DGJS_InitMusic() {
        return true;
    }

    function DGJS_RegisterSong(song, len) {
        const songData = Module.HEAPU8.subarray(song, song + len);
        const songBlob = new Blob([songData], {type: 'application/octet-stream'});
        songs[song] = URL.createObjectURL(songBlob);
        return song;
    }

    function DGJS_UnRegisterSong(songId) {
        songs.splice(songId);
    }

    function DGJS_PlaySong(songId, looping) {
    }

    function DGJS_StopSong() {}
    function DGJS_PauseSong() {}
    function DGJS_ResumeSong() {}
    function DGJS_SetMusicVolume(volume) {}
    function DGJS_PollMusic() {}

    // PCM stuff
    var sounds = [];
    var channels = new Array(16);

    function DGJS_InitSound() {
        for (let i = 0; i < 16; i++) {
            channels[i] = new Audio();
            channels[i].controls = true;
            document.body.appendChild(channels[i]);
        }
        return true;
    }

    function DGJS_ShutdownSound() {}
    function DGJS_UpdateSound() {}

    function DGJS_UpdateSoundParams(channel, volume, pan) {
        channels[channel].volume = volume / 127;
    }

    function DGJS_StartSound(sfxlumpnum, channel, volume, pan) {
        while (!channels[channel].paused) {
            // Doom tends to use channel 0 even when later channels are
            // inactive, which means that the other channels are usually open
            channel++;
        }
    
        if (channel >= 16) {
            return channel;
        }
    
        channels[channel].src = sounds[sfxlumpnum];
        channels[channel].volume = volume / 127;
        channels[channel].load();
        channels[channel].play();
        return channel;
    }

    function DGJS_StopSound(channel) {}

    function DGJS_SoundIsPlaying(channel) {
        if (channels[channel])
            return channels[channel].paused;

        return false;
    }

    function writeWord32(array, index, word) {
        for (var i = 0; i < 4; i++) {
            array[index + i] = word & 0xFF;
            word >>= 8;
        }
    }

    function DGJS_CacheSFX_PCM(dataPtr, len, sfxlumpnum) {
        const rawSound = Module.HEAPU8.subarray(dataPtr, dataPtr + len);
        const sampleRate = rawSound[3]<<8 | rawSound[2];

        const wavFile = new Uint8Array((rawSound.length - 8) + 44);
        writeWord32(wavFile, 0, 0x46464952);    // "RIFF"
        writeWord32(wavFile, 4, wavFile.length - 1); 
        writeWord32(wavFile, 8, 0x45564157);    // "WAVE"
        writeWord32(wavFile, 12, 0x20746D66);   // "fmt "
        writeWord32(wavFile, 16, 16);
        writeWord32(wavFile, 20, 0x00010001);
        writeWord32(wavFile, 24, sampleRate);
        writeWord32(wavFile, 28, sampleRate);
        writeWord32(wavFile, 32, 0x00080001);
        writeWord32(wavFile, 36, 0x61746164);   // "data"
        writeWord32(wavFile, 40, rawSound.length - 8);

        for (var i = 8; i < rawSound.length; i++) {
            wavFile[i + 36] = rawSound[i];
        }
        
        const soundBlob = new Blob([wavFile], {type: 'audio/wav'});
        sounds[sfxlumpnum] = URL.createObjectURL(soundBlob);
    }

    function DGJS_CacheSFX_Buzzer(dataPtr, size, sfxlumpnum) {}
    
    document.addEventListener('keydown', (event) => {
        keyQueue.push([_toDoomKey(event.keyCode), 1]);
    });

    document.addEventListener('keyup', (event) => {
        keyQueue.push([_toDoomKey(event.keyCode), 0]);
    });

  </script>
</body>
</html>
